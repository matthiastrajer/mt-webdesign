name: Deploy to Hostinger

# Läuft bei jedem Push auf master (inkl. Sveltia-CMS-Edits) sowie
# manuell über den "Run workflow"-Button im Actions-Tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci

      # Kein BASE_PATH mehr — auf der Custom-Domain läuft die Seite an
      # der Root (mtx-webdesign.at/), nicht unter /mt-webdesign/
      - name: Astro-Build
        run: npm run build

      # SamKirkland/FTP-Deploy-Action: syncht dist/ nach public_html/,
      # führt zwischen den Deploys eine .ftp-deploy-sync-state.json auf
      # dem Server mit, dadurch werden nur geänderte Dateien übertragen.
      # Erste Ausführung lädt alles hoch, spätere Deploys sind sehr schnell.
      - name: FTP-Upload nach Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/
          # Log-Level erhöht — sonst sieht man in GitHub Actions nicht,
          # ob wirklich Dateien übertragen wurden oder ob der Sync-State
          # sagt "alles schon aktuell" und heimlich nichts tut.
          log-level: verbose
          # Erzwingt einen kompletten Reset auf dem Server und einen
          # frischen Full-Upload — löscht ggf. verwaisten Sync-State,
          # der aus dem ersten (kaputten) Deploy-Versuch stammt.
          # Nach dem nächsten erfolgreichen Deploy wieder auf false.
          dangerous-clean-slate: true
          # Hostinger-eigene Dateien (SSL-Verifizierung, Log-Ordner)
          # nicht anfassen, falls dort welche liegen
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/error_log
            **/.htaccess
