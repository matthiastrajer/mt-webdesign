name: Deploy to Hostinger

# Läuft bei jedem Push auf master (inkl. Sveltia-CMS-Edits) sowie
# manuell über den "Run workflow"-Button im Actions-Tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci

      # Kein BASE_PATH mehr — auf der Custom-Domain läuft die Seite an
      # der Root (mtx-webdesign.at/), nicht unter /mt-webdesign/
      - name: Astro-Build
        run: npm run build

      # SamKirkland/FTP-Deploy-Action: syncht dist/ nach public_html/,
      # führt zwischen den Deploys eine .ftp-deploy-sync-state.json auf
      # dem Server mit, dadurch werden nur geänderte Dateien übertragen.
      # Erste Ausführung lädt alles hoch, spätere Deploys sind sehr schnell.
      - name: FTP-Upload nach Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          # Doc-Root der Domain liegt bei Hostinger NICHT unter ~/public_html/,
          # sondern unter ~/domains/mtx-webdesign.at/public_html/. Uploads
          # nach ~/public_html/ zeigen sich zwar im Konto-Dateimanager, sind
          # aber für die Domain unerreichbar → 403 Forbidden.
          server-dir: /domains/mtx-webdesign.at/public_html/
          # Log-Level erhöht — sonst sieht man in GitHub Actions nicht,
          # ob wirklich Dateien übertragen wurden oder ob der Sync-State
          # sagt "alles schon aktuell" und heimlich nichts tut.
          log-level: verbose
          # Clean-slate war einmalig für die Aufräumaktion nötig (alte
          # manuelle Repo-Uploads in domains/mtx-webdesign.at/public_html/).
          # Jetzt aus: sonst wird bei jedem Deploy der Doc-Root ~90 Sek.
          # komplett geleert (Downtime → 403), UND riskiert Hostingers
          # auto-generierte .htaccess mitzureißen, wenn das Exclude-Muster
          # die Root-Datei nicht sauber matcht.
          dangerous-clean-slate: false
          # Nur Hostinger-eigene Dateien schonen. Muster mit UND ohne **/
          # notiert, da minimatch je nach Kontext eine leere Präfix-Match
          # von `**/` bei Dateien direkt an der server-dir-Wurzel nicht
          # zuverlässig zulässt.
          exclude: |
            .htaccess
            **/.htaccess
            error_log
            **/error_log
            .well-known/**
            **/.well-known/**
